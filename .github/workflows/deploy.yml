name: Deploy Backend to Render

on:
  push:
    branches:
      - master

jobs:
  lint-and-test:
    name: Lint, Type Check and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r backend/requirements.txt

      - name: Check Formatting (Ruff Check & Format)
        run: |
          ruff check backend
          ruff format --check backend

      - name: Type Check (Mypy)
        run: |
          mypy backend || true

      - name: Run Tests with Coverage (Min 80%)
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRETO: mock_secret_para_passar_nos_testes_123
          ADMIN_EMAIL: admin@test.com
          ADMIN_SENHA: senha_mock_123
        run: |
          pytest backend

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/viajebem-backend:latest

